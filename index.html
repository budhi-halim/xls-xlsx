<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafbfc">
  <meta name="description" content="Convert XLS and Excel 2003 XML files to XLSX in your browser.">
  <title>XLS to XLSX Converter</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="legacy.js?v=3" defer></script>
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="XLS to XLSX Converter"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z M14 3v5h4 M10 12h5 M10 16h5"/></svg></span><span>XLS <span class="arrow">→</span> XLSX</span></a>
      <a class="source" href="https://github.com/budhi-halim/xls-xlsx" target="_blank" rel="noopener noreferrer">GitHub <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7 M9 7h8v8"/></svg></a>
    </header>
    <main>
      <div class="heading"><h1>Convert spreadsheets</h1><span>.xls · .xml · .xlsx</span></div>
      <section class="panel" aria-label="Spreadsheet conversion">
        <label id="dropzone" class="dropzone" for="file-input">
          <input id="file-input" type="file" multiple accept=".xls,.xml,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="Choose spreadsheets">
          <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5 M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
          <span class="drop-title">Drop files here or <strong>browse</strong></span>
          <span class="drop-note">Select one or multiple files</span>
        </label>
        <div class="file-header"><div class="file-heading">Files <span id="queue-count">0</span></div><div class="header-actions"><button type="button" id="add-btn" hidden>Add files</button><button type="button" id="clear-btn" hidden>Clear all</button></div></div>
        <div id="file-list" class="file-list" aria-live="polite"><p class="empty">No files selected</p></div>
        <div class="actions"><button id="convert-btn" type="button" class="primary" disabled>Convert to XLSX</button><button id="zip-btn" type="button" class="secondary" hidden>Download ZIP</button></div>
        <div id="overall-progress" class="progress" hidden><div class="progress-copy"><span id="progress-label">Converting</span><span id="progress-percent">0%</span></div><div class="progress-track" id="progress-track" role="progressbar" aria-label="Conversion progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><span id="progress-fill"></span></div></div>
        <p id="message" class="message" role="status" aria-live="polite" hidden></p>
      </section>
    </main>
  </div>
</body>
</html>
